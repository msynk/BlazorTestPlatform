name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  versions:
    # The Playwright image is derived from the pinned Microsoft.Playwright package (Directory.Packages.props), exactly
    # like scripts/visual-tests.sh, so upgrading Playwright never needs a manual tag change here.
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.read.outputs.playwright }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Directory.Packages.props
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          version=$(sed -n 's/.*Include="Microsoft\.Playwright" Version="\([^"]*\)".*/\1/p' Directory.Packages.props | head -n 1)
          test -n "$version"
          echo "playwright=$version" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Same image as scripts/visual-tests.sh: screenshots match the committed chromium-linux baselines exactly.
    container:
      image: mcr.microsoft.com/playwright/dotnet:v${{ needs.versions.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build BlazorTestPlatform.slnx -c Release

      - name: Unit and in-memory tests
        run: |
          for project in tests/*/*.csproj; do
            dotnet test --project "$project" -c Release --no-build
          done

      - name: Restore flake history
        uses: actions/cache@v4
        with:
          path: .btp/history.json
          key: btp-history-${{ github.run_id }}
          restore-keys: btp-history-

      # CI never writes baselines: missing or changed screenshots fail the build (BtpSettings defaults on CI). After a
      # Playwright upgrade, BaselineProvenanceTests fail first and point to the "Regenerate visual baselines" workflow.
      - name: End-to-end (bUnit, cross-hosting matrix, visual, axe, in-app play)
        run: dotnet test --project samples/Contoso.UI.Tests -c Release --no-build

      - name: Report
        if: always()
        run: >
          dotnet run --project src/BlazorTestPlatform.Cli -c Release --
          report -p samples/Contoso.UI.Tests
          --junit samples/Contoso.UI.Tests/TestResults/btp/junit.xml
          --github-summary --history .btp/history.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btp-report
          path: samples/Contoso.UI.Tests/TestResults/btp
          retention-days: 14

  trimmed-publish:
    # Guards trimming: the stories, workbench and in-app driver must work in a trimmed Release WebAssembly publish.
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright/dotnet:v${{ needs.versions.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish (trimmed WebAssembly client)
        run: dotnet publish samples/Contoso.Workbench -c Release -o /tmp/workbench -p:TrimmerSingleWarn=false -warnaserror:IL2026,IL2060,IL2070,IL2072,IL2091
      - name: Start the published workbench
        run: |
          (cd /tmp/workbench && ASPNETCORE_ENVIRONMENT=Production dotnet Contoso.Workbench.dll --urls http://127.0.0.1:5288 > /tmp/workbench.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5288/_workbench > /dev/null && exit 0; sleep 1; done
          cat /tmp/workbench.log; exit 1
      - name: Cross-hosting, in-app play and live controls against the published app
        env:
          BTP_BASE_URL: http://127.0.0.1:5288
        run: dotnet test --project samples/Contoso.UI.Tests -c Release -- --filter-class '*CrossHostingTests' --filter-class '*InAppPlayTests' --filter-class '*ArgControlsTests'

  pack:
    runs-on: ubuntu-latest
    needs: [build-and-test, trimmed-publish]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        run: |
          dotnet build src/BlazorTestPlatform.Generators -c Release
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release -o artifacts/packages
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
